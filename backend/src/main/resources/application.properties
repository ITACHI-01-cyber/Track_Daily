# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=habit-track-backend

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/habit-track}
spring.data.mongodb.database=${MONGODB_DATABASE:habit-track}

# Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.com.habittrack=DEBUG

# Spring MVC
spring.mvc.log-request-details=true
