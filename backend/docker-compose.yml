version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: habit-track-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: habit-track
    volumes:
      - mongodb_data:/data/db
    networks:
      - habit-track-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: habit-track-app
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/habit-track?authSource=admin
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - habit-track-network

volumes:
  mongodb_data:

networks:
  habit-track-network:
    driver: bridge
