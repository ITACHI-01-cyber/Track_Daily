version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: habit-track-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: habit-track
    volumes:
      - mongodb-data:/data/db
    networks:
      - habit-track-network

  mongo-express:
    image: mongo-express:latest
    container_name: habit-track-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - habit-track-network

volumes:
  mongodb-data:

networks:
  habit-track-network:
    driver: bridge
