# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=habit-track-backend

# MongoDB Configuration
# Local MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/habit-track
# Or use connection string with authentication:
# spring.data.mongodb.uri=mongodb://username:password@localhost:27017/habit-track

# Alternative: Individual MongoDB properties
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=habit-track

# Logging
logging.level.root=INFO
logging.level.com.habittrack=DEBUG

# Spring MVC
spring.mvc.log-request-details=true
